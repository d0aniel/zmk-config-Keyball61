CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# --- PMW3610 Driver Configuration ---
CONFIG_PMW3610=y
# Default trackball sensitivity (CPI/DPI). Higher = faster.
CONFIG_PM_DEVICE=y
CONFIG_PMW3610_PM=y
CONFIG_PMW3610_CPI=3200
CONFIG_PMW3610_CPI_DIVIDOR=4
CONFIG_PMW3610_ORIENTATION_180=y
# Sensitivity when in Snipe mode.
CONFIG_PMW3610_SNIPE_CPI=400
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
# Scroll speed divisor. Higher = slower scrolling.
CONFIG_PMW3610_SCROLL_TICK=64
# Invert scroll direction.
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
# Enable smart algorithm for smoother movement.
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n#CONFIG_PMW3610_FORCE_AWAKE=n
# Polling rate. 125Hz (8ms/report) roughly matches what the BLE link can
# actually deliver; 250Hz over-produces for an 11.25ms connection interval
# and the excess reports queue in the TX buffers, showing up as laggy
# tracking rather than smoother tracking.
CONFIG_PMW3610_POLLING_RATE_125_SW=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
# Timeout for auto-switching to Mouse layer after trackball movement (ms).
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=750
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0
