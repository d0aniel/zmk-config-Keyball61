# Bluetooth connection interval (unit: 1.25ms). Lower value = lower latency but higher power consumption.
# ZMK already defaults MIN_INT to 6, so setting MAX_INT=6 pins the interval at
# 7.5ms (BLE's floor) instead of letting the host choose anything up to 11.25ms.
# At 7.5ms the link drains slightly faster than the trackball's 125Hz (8ms)
# polling produces, so movement reports no longer queue up behind the radio.
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
# Bluetooth latency (unit: connection intervals). Higher value = lower power consumption but higher latency.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Set transmission power to max (+8dBm). Improves connection stability.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# Debounce. Default is 5ms each; press debounce is added to every keystroke
# before it is reported, so 1ms shaves ~4ms of latency while still rejecting
# short noise spikes (0 would be true eager debouncing, but noise-vulnerable).
# Release stays at 5ms: it costs nothing perceptually and is the setting that
# guards against a brief contact dropout registering as a phantom release,
# which is what turns one press into two characters.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
